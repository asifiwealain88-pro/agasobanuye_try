<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yeye Agaso — Agasobanuye Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  :root{ --bg:#0f0f0f; --accent:#f5c518; }
  body{background:var(--bg);font-family:Inter,system-ui,sans-serif}
  .row::-webkit-scrollbar{height:8px}
  .row::-webkit-scrollbar-thumb{background:#333;border-radius:99px}
  .row::-webkit-scrollbar-track{background:transparent}
  .card:hover{transform:scale(1.06);z-index:20}
  .card{transition:transform .25s ease, box-shadow .25s}
  .card:hover{box-shadow:0 20px 40px rgba(0,0,0,.7)}
  .fade-mask{background:linear-gradient(90deg,#0f0f0f 0%,rgba(15,15,15,.75) 40%,rgba(15,15,15,.1) 70%,transparent 100%)}
  .glow{text-shadow:0 0 24px rgba(245,197,24,.35)}
  @keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
  .pop{animation:pop .22s ease-out}
  .noscroll{overflow:hidden}
</style>
</head>
<body class="text-neutral-200 selection:bg-[#f5c518] selection:text-black">

<!-- NAV -->
<header id="nav" class="fixed top-0 inset-x-0 z-50 transition-colors duration-300">
  <div class="max-w-[1500px] mx-auto px-4 sm:px-6 py-3 flex items-center gap-4">
    <a href="#" class="flex items-center gap-2 shrink-0">
      <div class="w-9 h-9 rounded-lg bg-[#f5c518] grid place-items-center font-black text-black text-lg">Y</div>
      <span class="font-black text-xl tracking-tight hidden sm:block">Yeye<span class="text-[#f5c518]">Agaso</span></span>
    </a>

    <nav class="hidden lg:flex items-center gap-1 ml-4 text-sm font-semibold text-neutral-300">
      <button data-cat="All" class="catbtn px-3 py-1.5 rounded-full hover:text-white">Home</button>
      <button data-cat="Action" class="catbtn px-3 py-1.5 rounded-full hover:text-white">Action</button>
      <button data-cat="Indian" class="catbtn px-3 py-1.5 rounded-full hover:text-white">Indian</button>
      <button data-cat="Series" class="catbtn px-3 py-1.5 rounded-full hover:text-white">Series</button>
      <button data-cat="Rocky" class="catbtn px-3 py-1.5 rounded-full hover:text-white">Translated by Rocky</button>
      <button data-cat="Kimenyi" class="catbtn px-3 py-1.5 rounded-full hover:text-white">Translated by Kimenyi</button>
    </nav>

    <div class="flex-1"></div>

    <div class="relative w-full max-w-xs">
      <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-neutral-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Search movies, VJs..." class="w-full bg-white/10 backdrop-blur border border-white/10 focus:border-[#f5c518] outline-none rounded-full pl-9 pr-3 py-2 text-sm placeholder:text-neutral-500">
    </div>

    <button id="menuBtn" class="lg:hidden p-2 rounded-lg bg-white/10"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <div class="hidden sm:grid w-9 h-9 rounded-full bg-gradient-to-br from-[#f5c518] to-orange-600 place-items-center font-bold text-black">A</div>
  </div>
  <div id="mobileMenu" class="hidden lg:hidden px-4 pb-3 bg-[#0f0f0f]/95 backdrop-blur border-b border-white/10">
    <div class="flex flex-wrap gap-2 text-sm">
      <button data-cat="All" class="catbtn px-3 py-1.5 rounded-full bg-white/10">Home</button>
      <button data-cat="Action" class="catbtn px-3 py-1.5 rounded-full bg-white/10">Action</button>
      <button data-cat="Indian" class="catbtn px-3 py-1.5 rounded-full bg-white/10">Indian</button>
      <button data-cat="Series" class="catbtn px-3 py-1.5 rounded-full bg-white/10">Series</button>
      <button data-cat="Rocky" class="catbtn px-3 py-1.5 rounded-full bg-white/10">Rocky</button>
      <button data-cat="Kimenyi" class="catbtn px-3 py-1.5 rounded-full bg-white/10">Kimenyi</button>
    </div>
  </div>
</header>

<!-- HERO -->
<section id="hero" class="relative h-[88vh] min-h-[560px] w-full">
  <img id="heroImg" src="" alt="" class="absolute inset-0 w-full h-full object-cover">
  <div class="absolute inset-0 fade-mask"></div>
  <div class="absolute inset-x-0 bottom-0 h-48 bg-gradient-to-t from-[#0f0f0f] to-transparent"></div>
  <div class="relative h-full max-w-[1500px] mx-auto px-4 sm:px-6 flex flex-col justify-end sm:justify-center pb-24 sm:pb-0">
    <div class="max-w-2xl">
      <span class="inline-flex items-center gap-2 text-xs font-bold tracking-widest text-[#f5c518] uppercase mb-3">
        <span class="w-6 h-[2px] bg-[#f5c518]"></span> Featured Agasobanuye
      </span>
      <h1 id="heroTitle" class="text-4xl sm:text-6xl lg:text-7xl font-black leading-[0.95] text-white glow"></h1>
      <div id="heroMeta" class="flex flex-wrap items-center gap-3 mt-4 text-sm text-neutral-300"></div>
      <p id="heroDesc" class="mt-4 text-neutral-300 text-sm sm:text-base leading-relaxed max-w-xl"></p>
      <div class="flex flex-wrap gap-3 mt-7">
        <button id="heroPlay" class="inline-flex items-center gap-2 bg-[#f5c518] hover:bg-yellow-300 text-black font-bold px-7 py-3 rounded-full transition">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Play Now
        </button>
        <button id="heroTrailer" class="inline-flex items-center gap-2 bg-white/10 hover:bg-white/20 backdrop-blur border border-white/20 text-white font-bold px-7 py-3 rounded-full transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v8m-4-4h8"/><circle cx="12" cy="12" r="9"/></svg> Watch Trailer
        </button>
      </div>
    </div>
  </div>
</section>

<main class="relative z-10 -mt-20 pb-24 space-y-10">
  <div id="rows" class="max-w-[1500px] mx-auto px-4 sm:px-6 space-y-12"></div>

  <!-- VJ strip -->
  <section class="max-w-[1500px] mx-auto px-4 sm:px-6">
    <h2 class="text-2xl font-black text-white mb-4">Popular VJs</h2>
    <div id="vjs" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4"></div>
  </section>

  <section id="results" class="max-w-[1500px] mx-auto px-4 sm:px-6 hidden">
    <h2 id="resultsTitle" class="text-2xl font-black text-white mb-4"></h2>
    <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 xl:grid-cols-6 gap-4"></div>
    <p id="noRes" class="hidden text-neutral-500 py-10 text-center">No movies found. Try another VJ or title.</p>
  </section>
</main>

<footer class="border-t border-white/10 py-10 text-center text-sm text-neutral-500">
  <div class="font-black text-white text-lg mb-2">Yeye<span class="text-[#f5c518]">Agaso</span></div>
  yeye-agaso.com — Agasobanuye movies in Kinyarwanda. Demo project © 2026
</footer>

<!-- MODAL -->
<div id="modal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/85 backdrop-blur-sm p-4">
  <div class="pop w-full max-w-5xl bg-[#171717] rounded-2xl overflow-hidden border border-white/10 shadow-2xl">
    <div class="relative bg-black aspect-video">
      <iframe id="player" class="absolute inset-0 w-full h-full" src="" title="player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      <button id="closeModal" class="absolute top-3 right-3 w-10 h-10 grid place-items-center rounded-full bg-black/70 hover:bg-[#f5c518] hover:text-black text-white transition">✕</button>
    </div>
    <div class="p-5 sm:p-6">
      <h3 id="mTitle" class="text-2xl font-black text-white"></h3>
      <div id="mMeta" class="flex flex-wrap gap-3 mt-2 text-sm text-neutral-400"></div>
      <p id="mDesc" class="mt-3 text-neutral-300 text-sm leading-relaxed"></p>
    </div>
  </div>
</div>

<script>
const P = (id,q) => `https://image.tmdb.org/t/p/w500${id}`;
const img = u => u;
const movies = [
  {t:"Inyenyeri y'Umujura", vj:"Rocky", y:2024, cat:["Action"], r:8.6, img:"https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=600&q=80", yt:"5PSNL1qE6VY", d:"Umujura w'inararibonye akora ubujura bwa nyuma i Kigali. Agasobanuye mu Kinyarwanda na VJ Rocky."},
  {t:"Amarira y'Intambara", vj:"Kimenyi", y:2023, cat:["Action"], r:8.1, img:"https://images.unsplash.com/photo-1574267432553-4b4628081c31?w=600&q=80", yt:"d9MyW72ELq0", d:"Intambara ikaze hagati y'imitwe ibiri, hamwe n'umusirikare w'intwari urwanira igihugu cye."},
  {t:"Urukundo rwa Mumbai", vj:"Junior", y:2024, cat:["Indian"], r:7.9, img:"https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?w=600&q=80", yt:"VaOijiJbIBw", d:"Inkuru y'urukundo iryoshye yo mu Buhinde, yuzuye indirimbo n'imbyino nziza."},
  {t:"Intwari ya Delhi", vj:"Rocky", y:2022, cat:["Indian","Action"], r:8.3, img:"https://images.unsplash.com/photo-1587474260584-136574528ed5?w=600&q=80", yt:"xvFZjo5PgG0", d:"Umupolisi wo muri Delhi ahangana n'urusobe rw'abagizi ba nabi. Agasobanuye gashyushye."},
  {t:"Abakozi b'Umwijima S1", vj:"Kimenyi", y:2025, cat:["Series"], r:9.0, img:"https://images.unsplash.com/photo-1485846234645-a62644f84728?w=600&q=80", yt:"EngW7tLk6R8", d:"Ibice 12 by'urukurikirane rushyushye ku itsinda ry'abasore bacukumbura amabanga."},
  {t:"Umuryango w'Amaraso", vj:"Soba", y:2023, cat:["Series","Action"], r:8.4, img:"https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=600&q=80", yt:"CBBE0Y3Ff0I", d:"Umuryango w'abagizi ba nabi uhangana n'ubutegetsi mu mujyi munini."},
  {t:"Inzira y'Ubuzima", vj:"Junior", y:2021, cat:["Indian"], r:7.5, img:"https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?w=600&q=80", yt:"K4TOrB7at0Y", d:"Urugendo rw'umusore ushaka kugera ku nzozi ze adafite ubushobozi."},
  {t:"Imbaraga z'Umwuka", vj:"Rocky", y:2025, cat:["Action"], r:8.8, img:"https://images.unsplash.com/photo-1518676590629-3dcbd9c5a5c9?w=600&q=80", yt:"TcMBFSGVi1c", d:"Filime y'ibitangaza ikomeye y'umuntu uhabwa imbaraga zidasanzwe."},
  {t:"Ijoro Ryijimye", vj:"Kimenyi", y:2024, cat:["Action","Series"], r:8.0, img:"https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=600&q=80", yt:"8ugaeA-nMTc", d:"Mu ijoro rimwe, umujyi wose uhinduka urugamba. Agasobanuye na VJ Kimenyi."},
  {t:"Amabanga ya Bollywood", vj:"Soba", y:2022, cat:["Indian"], r:7.7, img:"https://images.unsplash.com/photo-1594909122845-11baa439b7bf?w=600&q=80", yt:"JfVOs4VSpmA", d:"Inyuma y'amatara ya Bollywood hari amabanga menshi atazwi."},
  {t:"Intambara y'Ibirunga", vj:"Rocky", y:2025, cat:["Action"], r:9.1, img:"https://images.unsplash.com/photo-1536751048178-14106afab4f4?w=600&q=80", yt:"zSWdZVtXT7E", d:"Mu birunga bya Virunga, hahurira abashakashatsi n'abahigi b'inyamaswa."},
  {t:"Umugani w'Umwami", vj:"Junior", y:2023, cat:["Series"], r:8.2, img:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=600&q=80", yt:"rt-2cxAiPJk", d:"Urukurikirane rw'amateka y'ingoma n'ubutwari bw'abami."},
  {t:"Urugamba rwa Nyuma", vj:"Kimenyi", y:2021, cat:["Action"], r:7.8, img:"https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&q=80", yt:"6ZfuNTqbHE8", d:"Umusirikare usezeye asubira ku rugamba kugira ngo arokore umuryango we."},
  {t:"Indirimbo y'Umutima", vj:"Soba", y:2024, cat:["Indian"], r:8.5, img:"https://images.unsplash.com/photo-1598899134739-24c46f58b8c0?w=600&q=80", yt:"LsoLEjrDogU", d:"Umuhanzi ukiri muto ahura n'urukundo rutunguranye muri Mumbai."}
];
const vjs=[{n:"VJ Rocky",c:"Translated by Rocky",k:"Rocky",i:"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&q=80"},
{n:"VJ Kimenyi",c:"Translated by Kimenyi",k:"Kimenyi",i:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400&q=80"},
{n:"VJ Junior",c:"Soba by Junior",k:"Junior",i:"https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=400&q=80"},
{n:"VJ Soba",c:"Soba by Soba",k:"Soba",i:"https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=400&q=80"},
{n:"VJ Ice P",c:"Agasobanuye",k:"Rocky",i:"https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=400&q=80"},
{n:"VJ Ariel",c:"Agasobanuye",k:"Junior",i:"https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400&q=80"}];

const hero = movies[10];
heroImg.src=hero.img; heroTitle.textContent=hero.t; heroDesc.textContent=hero.d;
heroMeta.innerHTML=`<span class="text-[#f5c518] font-bold">★ ${hero.r}</span><span>${hero.y}</span><span class="px-2 py-0.5 border border-white/30 rounded text-xs">HD</span><span>Soba by ${hero.vj}</span>`;
heroPlay.onclick=()=>open_(hero); heroTrailer.onclick=()=>open_(hero);

function card(m){
  return `<div class="card cursor-pointer group" data-id="${m.t}">
    <div class="relative rounded-xl overflow-hidden bg-neutral-900 aspect-[2/3]">
      <img src="${m.img}" class="w-full h-full object-cover" loading="lazy" alt="${m.t}">
      <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/10 to-transparent opacity-80"></div>
      <span class="absolute top-2 left-2 bg-[#f5c518] text-black text-[10px] font-black px-2 py-0.5 rounded">AGASOBANUYE</span>
      <span class="absolute top-2 right-2 bg-black/70 text-[#f5c518] text-[10px] font-bold px-2 py-0.5 rounded">★ ${m.r}</span>
      <div class="absolute inset-0 grid place-items-center opacity-0 group-hover:opacity-100 transition">
        <div class="w-14 h-14 rounded-full bg-[#f5c518] grid place-items-center shadow-xl"><svg class="w-7 h-7 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
      </div>
      <div class="absolute bottom-0 p-3">
        <h3 class="font-bold text-white text-sm leading-tight line-clamp-2">${m.t}</h3>
        <p class="text-[11px] text-[#f5c518] font-semibold mt-0.5">Soba by ${m.vj}</p>
        <p class="text-[11px] text-neutral-400">${m.y} • ${m.cat[0]}</p>
      </div>
    </div></div>`;
}
function rowHTML(title, list){
  return `<section><div class="flex items-end justify-between mb-3"><h2 class="text-xl sm:text-2xl font-black text-white">${title}</h2>
  <span class="text-xs text-neutral-500">${list.length} movies</span></div>
  <div class="row flex gap-4 overflow-x-auto pb-6 -mb-4">${list.map(m=>`<div class="shrink-0 w-[150px] sm:w-[190px]">${card(m)}</div>`).join("")}</div></section>`;
}
function renderRows(){
  rows.innerHTML = rowHTML("🔥 Trending Now", [...movies].sort((a,b)=>b.r-a.r).slice(0,8))
    + rowHTML("🆕 Latest Agasobanuye", [...movies].sort((a,b)=>b.y-a.y).slice(0,8))
    + rowHTML("🎬 Translated by Rocky", movies.filter(m=>m.vj==="Rocky"))
    + rowHTML("🎙️ Translated by Kimenyi", movies.filter(m=>m.vj==="Kimenyi"))
    + rowHTML("🇮🇳 Indian Movies", movies.filter(m=>m.cat.includes("Indian")));
}
renderRows();
vjs.innerHTML = vjs_html();
function vjs_html(){return vjs.map(v=>`<button data-cat="${v.k}" class="catbtn group text-center"><img src="${v.i}" class="w-full aspect-square object-cover rounded-full border-2 border-transparent group-hover:border-[#f5c518] transition"><p class="mt-2 font-bold text-white text-sm">${v.n}</p><p class="text-xs text-neutral-500">${v.c}</p></button>`).join("")}

function filter(cat){
  const list = cat==="All"?movies:movies.filter(m=>m.cat.includes(cat)||m.vj===cat);
  show(cat==="All"?"":`Category: ${cat}`, list, cat!=="All");
}
function show(title,list,on){
  if(!on){results.classList.add("hidden"); rows.classList.remove("hidden"); document.getElementById("vjs").parentElement.classList.remove("hidden"); return;}
  rows.classList.add("hidden"); document.getElementById("vjs").parentElement.classList.add("hidden");
  results.classList.remove("hidden"); resultsTitle.textContent=title;
  resultsGrid.innerHTML=list.map(card).join(""); noRes.classList.toggle("hidden",list.length>0);
  window.scrollTo({top:document.getElementById("hero").offsetHeight-120,behavior:"smooth"});
}
document.addEventListener("click",e=>{
  const b=e.target.closest(".catbtn"); if(b){filter(b.dataset.cat); mobileMenu.classList.add("hidden"); return;}
  const c=e.target.closest(".card"); if(c){const m=movies.find(x=>x.t===c.dataset.id); open_(m);}
});
search.addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase();
  if(!q) return show("",[],false);
  show(`Results for "${e.target.value}"`, movies.filter(m=>(m.t+m.vj+m.cat.join()).toLowerCase().includes(q)), true);
});
function open_(m){
  player.src=`https://www.youtube.com/embed/${m.yt}?autoplay=1&rel=0`;
  mTitle.textContent=m.t;
  mMeta.innerHTML=`<span class="text-[#f5c518] font-bold">★ ${m.r}</span><span>${m.y}</span><span>Soba by ${m.vj}</span><span class="px-2 border border-white/20 rounded text-xs">${m.cat.join(" • ")}</span>`;
  mDesc.textContent=m.d;
  modal.classList.remove("hidden"); modal.classList.add("flex"); document.body.classList.add("noscroll");
}
function close_(){ player.src=""; modal.classList.add("hidden"); modal.classList.remove("flex"); document.body.classList.remove("noscroll"); }
closeModal.onclick=close_;
modal.onclick=e=>{if(e.target===modal) close_()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")close_()});
menuBtn.onclick=()=>mobileMenu.classList.toggle("hidden");
onscroll=()=>nav.classList.toggle("bg-[#0f0f0f]/95",scrollY>40),nav.classList.toggle("backdrop-blur",scrollY>40);
addEventListener("scroll",()=>{const s=scrollY>40;nav.classList.toggle("bg-[#0f0f0f]/95",s);nav.classList.toggle("shadow-lg",s);nav.classList.toggle("backdrop-blur",s);});
</script>
</body>
</html>
